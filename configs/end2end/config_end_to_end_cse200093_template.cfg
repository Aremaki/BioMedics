# --- Variables to set ---

[vars]
input_folder = "/export/home/cse200093/<your_input_folder>"
brat_output_folder = "/export/home/cse200093/brat_data/<brat_output_folder>"
batch_size = 10000
gpu_model = "a100" # e.g., "v100", "a100", "t4".
use_scratch_storage = false # Set to true if your input_folder is located inside scratch storage (recommended for faster processing)
use_hdd_storage = false # Set to true if your input_folder is located inside HDD storage (not recommended for performance)

# --- NER ---

[infer]
input_folder = ${vars.input_folder}
model_path = "/export/home/cse200093/Adam/biomedics/models/ner/expe_ner_final_v4/eds-biomedics-v5"
batch_size = ${vars.batch_size}

# --- EXTRACT MEASUREMENT ---

[debug]
debug = true

[spark]
deploy_mode = "client"
master = "local"
add_home = "true"
driver_memory = "32g"
executor_memory = "32g"
num_executors = 20
executor_cores = 8
memory_overhead = "3g"

[spark.conf]
spark.driver.maxResultSize = "16g"
spark.default.parallelism = 160
spark.shuffle.service.enabled = "true"
spark.sql.shuffle.partitions = 160
spark.yarn.am.memory = "4g"
spark.yarn.max.executor.failures = 10
spark.eventLog.enabled = "true"
spark.sql.execution.arrow.enabled = "true"
spark.sql.execution.arrow.pyspark.enabled = "true"

[script]
batch_size = ${vars.batch_size}
input_folder = ${vars.input_folder}
label_key = "BIO_comp"
labels_to_remove = ["BIO", "BIO_Val"]

# --- DRUG NORMALIZATION ---

[fuzzy_matching]
drug_dict_path = "/export/home/cse200093/BioMedics/data/drug_knowledge/final_dict.pkl"
input_folder = ${vars.input_folder}
label_to_normalize = "Chemical_and_drugs"
method = "jaro_winkler"
threshold = 0.8
qualifiers = ["Temporality", "Certainty", "Action", "Negation", "Allergie", "Family"]
batch_size = ${vars.batch_size}

# --- LAB TEST NORMALIZATION ---

[emdedding_similarity]
model_path = "/data/scratch/cse200093/word-embedding/sapbert_all"
input_folder = ${vars.input_folder}
umls_path = "lab_snomed_ct_2021AB.csv"
labels_column_name = "CUI"
# Name of the column which contains the CUIs
synonyms_column_name = "STR"
# Name of the column which contains the synonyms
label_to_normalize = "BIO"
qualifiers = ["Temporality", "Certainty", "Action", "Negation", "Allergie", "Family"]
column_name_to_normalize = "term_to_norm"
# Name of the preceding column of interest.
model_device = "cuda:0"
summary_method = "CLS"
batch_size = 128
file_batch_size = ${vars.batch_size}
tqdm_bar = true
save_umls_embeddings_dir = false
# set to False if you don't want to save
save_umls_des_dir = false
# set to False if you don't want to save
save_umls_labels_dir = false
# set to False if you don't want to save
save_data_embeddings_dir = false
# set to False if you don't want to save
normalize = true
cased = false
stopwords = [
    "for",
    "assay",
    "by",
    "tests",
    "minute",
    "exam",
    "with",
    "human",
    "moyenne",
    "in",
    "to",
    "from",
    "analyse",
    "test",
    "level",
    "fluid",
    "laboratory",
    "determination",
    "examination",
    "releasing",
    "quantitative",
    "screening",
    "and",
    "exploration",
    "factor",
    "method",
    "analysis",
    "laboratoire",
    "specimen",
    "or",
    "typing",
    "of",
    "concentration",
    "measurement",
    "detection",
    "procedure",
    "identification",
    "numeration",
    "hour",
    "retired",
    "technique",
    "count"
    ]
remove_stopwords_terms = true
remove_special_characters_terms = true
remove_stopwords_umls = true
remove_special_characters_umls = true

# --- Classify DISO ---

[classify_diso]
classif_model_path = "/export/home/cse200093/Expe_Pheno/20220607T140419_expe_pheno_classifier_camembert_l_umls_fr_local_best"
labels_path = "/export/home/cse200093/Expe_Pheno/out/labels_20220607T140419_expe_pheno_classifier_camembert_l_umls_fr_local.csv"
embedding_model_path = ""
input_folder = ${vars.input_folder}
stopwords = ${emdedding_similarity.stopwords}
qualifiers = ["Certainty", "Family", "Negation"]
batch_size = ${vars.batch_size}

# --- BRAT FORMATTING ---

[group_brat]
input_folder = ${vars.input_folder}
conf_path = "/export/home/cse200093/BioMedics/configs/brat_data"
output_folder = ${vars.brat_output_folder}
batch_size = ${vars.batch_size}
