    "measurement",
    "detection",
    "procedure",
    "identification",
    "numeration",
    "hour",
    "retired",
    "technique",
    "count"
    ]
remove_stopwords_terms = true
remove_special_characters_terms = true
remove_stopwords_umls = true
remove_special_characters_umls = true

# --- Classify DISO ---

[classify_diso]
classif_model_path = "/export/home/cse200093/Expe_Pheno/20220607T140419_expe_pheno_classifier_camembert_l_umls_fr_local_best"
labels_path = "/export/home/cse200093/Expe_Pheno/out/labels_20220607T140419_expe_pheno_classifier_camembert_l_umls_fr_local.csv"
embedding_model_path = ${emdedding_similarity.model_path}
brat_dirs = ${infer.output_folders}
stopwords = ${emdedding_similarity.stopwords}
qualifiers = ["Certainty", "Family", "Negation"]

# --- Treatments And Outcomes ---

[treatments_lab_tests_outcomes]
