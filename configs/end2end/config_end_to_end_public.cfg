# --- Global variables ---

[vars]
root_dir = "/export/home/cse200093"
base_dir = "/export/home/cse200093/Adam/biomedics"

# --- NER ---

[infer]
input_folders = [
    "${vars.base_dir}/data/raw_CRH",
    ]
model_path = "${vars.base_dir}/models/ner/expe_ner_final_v4/model-last"
output_folders = ["${vars.base_dir}/data/brat_pred"]

# --- EXTRACT MEASUREMENT ---

[debug]
debug = true

[spark]
deploy_mode = "client"
master = "local"
add_home = "true"
driver_memory = "32g"
executor_memory = "32g"
num_executors = 20
executor_cores = 8
memory_overhead = "3g"

[spark.conf]
spark.driver.maxResultSize = "16g"
spark.default.parallelism = 160
spark.shuffle.service.enabled = "true"
spark.sql.shuffle.partitions = 160
spark.yarn.am.memory = "4g"
spark.yarn.max.executor.failures = 10
spark.eventLog.enabled = "true"
spark.sql.execution.arrow.enabled = "true"
spark.sql.execution.arrow.pyspark.enabled = "true"

[script]
brat_dirs = ${infer.output_folders}
label_key = "BIO_comp"
labels_to_remove = ["BIO", "BIO_Val"]

# --- DRUG NORMALIZATION ---

[fuzzy_matching]
drug_dict_path = "${vars.base_dir}/data/drug_knowledge/final_dict.pkl"
brat_dirs = ${infer.output_folders}
label_to_normalize = "Chemical_and_drugs"
method = "jaro_winkler"
threshold = 0.8
qualifiers = ["Temporality", "Certainty", "Action", "Negation", "Allergie", "Family"]

# --- LAB TEST NORMALIZATION ---

[emdedding_similarity]
model_path = "${vars.base_dir}/models/word_embedding/SapBERT_all"
input_dirs = ${infer.output_folders}
umls_path = "lab_snomed_ct_2021AB.csv"
labels_column_name = "CUI"
# Name of the column which contains the CUIs
synonyms_column_name = "STR"
# Name of the column which contains the synonyms
label_to_normalize = "BIO"
qualifiers = ["Temporality", "Certainty", "Action", "Negation", "Allergie", "Family"]
column_name_to_normalize = "term_to_norm"
# Name of the preceding column of interest.
model_device = "cuda:0"
summary_method = "CLS"
batch_size = 128
tqdm_bar = true
save_umls_embeddings_dir = false
# set to False if you don't want to save
save_umls_des_dir = false
# set to False if you don't want to save
save_umls_labels_dir = false
# set to False if you don't want to save
save_data_embeddings_dir = false
# set to False if you don't want to save
normalize = true
cased = false
stopwords = [
    "for",
    "assay",
    "by",
    "tests",
    "minute",
    "exam",
    "with",
    "human",
    "moyenne",
    "in",
    "to",
    "from",
    "analyse",
    "test",
    "level",
    "fluid",
    "laboratory",
    "determination",
    "examination",
    "releasing",
    "quantitative",
    "screening",
    "and",
    "exploration",
    "factor",
    "method",
    "analysis",
    "laboratoire",
    "specimen",
    "or",
    "typing",
    "of",
    "concentration",
    "measurement",
    "detection",
    "procedure",
    "identification",
    "numeration",
    "hour",
    "retired",
    "technique",
    "count"
    ]
remove_stopwords_terms = true
remove_special_characters_terms = true
remove_stopwords_umls = true
remove_special_characters_umls = true

# --- BRAT FORMATTING ---

[group_brat]
input_dirs = ${infer.output_folders}
conf_path = "${vars.base_dir}/configs/brat_data"
output_dirs = ["${vars.root_dir}/brat_data/<YOUR_PROJECT_NAME>"]
