[spark]
deploy_mode = "client"
master = "local"
add_home = "true"
driver_memory = "64g"
executor_memory = "64g"
num_executors = 1
executor_cores = 1
memory_overhead = "3g"

[spark.conf]
spark.driver.maxResultSize = "16g"
spark.default.parallelism = 160
spark.shuffle.service.enabled = "true"
spark.sql.shuffle.partitions = 160
spark.yarn.am.memory = "4g"
spark.yarn.max.executor.failures = 10
spark.eventLog.enabled = "true"
spark.sql.execution.arrow.enabled = "true"
spark.sql.execution.arrow.pyspark.enabled = "true"

[script]
result_norm_bio = "../../data/CRH/pred_v4/sclerodermie_systemique_norm/pred_bio_coder_all.pkl"
result_norm_drug = "../../data/CRH/pred_v4/sclerodermie_systemique_norm/pred_med_fuzzy_jw.pkl"
result_ner_part_1 = "../../data/CRH/pred_v4/sclerodermie_systemique_ner_part_1"
result_ner_part_2 = "../../data/CRH/pred_v4/sclerodermie_systemique_ner_part_2"
spacy_docs_part_1 = "../../data/CRH/pred_v4/sclerodermie_systemique_all_docs_part_1.pkl"
spacy_docs_part_2 = "../../data/CRH/pred_v4/sclerodermie_systemique_all_docs_part_2.pkl"
brat_docs_part_1 = "../../data/CRH/pred_v4/sclerodermie_systemique_all_docs_brat_part_1"
brat_docs_part_2 = "../../data/CRH/pred_v4/sclerodermie_systemique_all_docs_brat_part_2"
sample_brat = "/export/home/cse200093/brat_data/BioMedics/sample_sclerodermie"
qualifiers_columns_name = ["Action", "Certainty", "Negation", "Temporality"]
